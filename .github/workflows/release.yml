name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: swift test

      # The same script as by hand: the installer (site/install.sh) takes PartyPortal-<arch>.zip and its
      # checksum from the latest release, so these names must not change.
      - name: Package
        run: ./scripts/package.sh

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ```bash
          curl -fsSL https://partyportal.inchi.dev/install.sh | bash
          ```

          For a Mac with Apple Silicon, macOS 14 or later. This build is not signed with an Apple Developer ID
          yet: it installs through Terminal, and macOS asks for the permissions again after each update.

          Or build it yourself: `./scripts/build-app.sh`.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes

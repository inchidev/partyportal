<!doctype html>
<meta charset="utf-8">
<title>PartyPortal bridge</title>
<style>html, body { margin: 0; background: #000; }</style>
<script>
// Runs inside PartyPortal's invisible web view. One side is a WebSocket to PartyPortal on this Mac,
// the other is a WebRTC connection straight to the guest's browser.
//
// From PartyPortal:  binary media messages (same framing the guest gets over WebSocket) and JSON {s: …}.
// To PartyPortal:    JSON {b: …} about the connection, and the guest's own JSON messages forwarded untouched.
// To the guest, video as a real media track when this WebKit can make one (VideoTrackGenerator): frames from
// PartyPortal are decoded here and handed to WebRTC, which encodes them again with its own rate control,
// retransmissions and jitter buffer. A data channel treats loss as congestion and stalls; a media track is
// built for it. Masks are painted before PartyPortal's encoder, so nothing unmasked reaches this page.
// Otherwise, and for everything else, three data channels:
//   video  (only without a track) reliable, ordered; a frame is split into pieces, first byte 1 marks the
//          last piece; the codec config travels on the same channel as text, so it arrives before its keyframe
//   audio  unreliable, unordered; one Opus packet per message, late sound is dropped rather than replayed
//   ctl    reliable; the guest's input and our pongs
//
// Through a portal that speaks relay protocol v2 there is no connection to a guest at all: the page publishes the
// same video track once to the portal's SFU, in three sizes (simulcast f/h/q), with the app's sound as an audio
// track, and every viewer subscribes there. Core asks with {s:'sfu-publish', key, ice, simulcast}; the page answers
// {b:'sfu-offer', key, sdp, tracks}, Core has the portal make the SFU calls and hands back {s:'sfu-answer', key,
// sdp}; then {b:'sfu-up', key} or {b:'sfu-down', key, why}. `key` is '' for the SFU; a stand-in without one
// (tools/portal-relay.mjs --v2) gets one publication per viewer, keyed by its name.
(() => {
  const key = new URLSearchParams(location.search).get('k')
  const PIECE = 60000
  let ws, pc, video, audio, ctl, dropping = false, askedKey = false, kbps = 8000
  // Diagnostics for one tick: the longest pause between frames from PartyPortal, and the deepest send queue.
  let lastIn = 0, maxInGap = 0, maxBuffered = 0

  const tell = obj => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)) }

  // ---- video as a media track ----
  // A worker decodes PartyPortal's H.264 and writes the frames into a VideoTrackGenerator; its track is
  // transferred here once and reused for every guest. No requestAnimationFrame anywhere: this page is 2×2 px.
  const WORKER = `
    let dec = null, writer = null, waitKey = true
    const b64 = s => { const bin = atob(s), out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out }
    try {
      const gen = new VideoTrackGenerator()
      writer = gen.writable.getWriter()
      self.postMessage({ track: gen.track }, [gen.track])
    } catch (e) { self.postMessage({ fail: String(e) }) }
    function configure(cfg) {
      try { if (dec && dec.state !== 'closed') dec.close() } catch {}
      dec = new VideoDecoder({
        output: f => { writer.write(f).then(() => { try { f.close() } catch {} }, () => { try { f.close() } catch {} }) },
        error: e => { waitKey = true; self.postMessage({ kf: 1, err: String(e) }) },
      })
      dec.configure({ codec: cfg.codec, description: b64(cfg.description), optimizeForLatency: true })
      waitKey = true
    }
    self.onmessage = e => {
      const m = e.data
      if (m.cfg) { try { configure(m.cfg) } catch (err) { self.postMessage({ fail: 'configure: ' + err }) } return }
      if (!writer || !dec || dec.state !== 'configured') return
      const view = new DataView(m), key = (view.getUint8(1) & 1) === 1
      if (waitKey && !key) return
      if (dec.decodeQueueSize > 4) { waitKey = true; self.postMessage({ kf: 1 }); return }  // fell behind: wait for a keyframe
      waitKey = false
      dec.decode(new EncodedVideoChunk({ type: key ? 'key' : 'delta', timestamp: Number(view.getBigInt64(2)), data: new Uint8Array(m, 10) }))
    }
  `
  let worker = null, genTrack = null, trackWhy = 'starting', lastCfg = null, sender = null, sentKbps = 0, lastOut = null
  try {
    if (!('VideoDecoder' in window)) throw new Error('no WebCodecs')
    worker = new Worker(URL.createObjectURL(new Blob([WORKER], { type: 'text/javascript' })))
    worker.onmessage = e => {
      if (e.data.track) { genTrack = e.data.track; trackWhy = '' }
      else if (e.data.fail) { genTrack = null; trackWhy = e.data.fail }
      else if (e.data.kf) tell({ b: 'kf' })
    }
    worker.onerror = e => { genTrack = null; trackWhy = 'worker: ' + (e.message || 'error') }
  } catch (e) { trackWhy = String(e) }

  // The ceiling WebRTC may use; under it, it picks the rate the path can carry by itself.
  async function capBitrate(force) {
    for (const pub of pubs.values()) {
      if (!pub.video || (pub.capped === kbps && !force)) continue
      try {
        const p = pub.video.getParameters()
        if (!p.encodings || !p.encodings.length) continue
        for (const e of p.encodings) { e.maxBitrate = Math.max(150, Math.round(kbps * (SHARE[e.rid] || 1))) * 1000; e.maxFramerate = 60 }
        await pub.video.setParameters(p)
        pub.capped = kbps
      } catch {}
    }
    if (!sender || sentKbps === kbps) return
    try {
      const p = sender.getParameters()
      if (!p.encodings || !p.encodings.length) return
      p.encodings[0].maxBitrate = kbps * 1000
      p.encodings[0].maxFramerate = 60
      await sender.setParameters(p)
      sentKbps = kbps
    } catch {}
  }
  async function trackInfo() {
    const live = [...pubs.values()].find(p => p.up)
    const peer = sender ? pc : live ? live.pc : null
    if (!peer) return null
    const stats = await peer.getStats()
    let out = null, back = null, pair = null, layers = 0, bytes = 0, frames = 0
    stats.forEach(s => {
      // With simulcast each layer has its own outbound-rtp: the numbers are the biggest layer's, the bitrate all of them.
      if (s.type === 'outbound-rtp' && s.kind === 'video') {
        layers++
        bytes += s.bytesSent || 0
        if (!out || (s.frameWidth || 0) > (out.frameWidth || 0)) out = s
      }
      else if (s.type === 'remote-inbound-rtp' && s.kind === 'video') back = s
      else if (s.type === 'candidate-pair' && s.availableOutgoingBitrate) pair = s
    })
    if (!out) return null
    frames = out.framesEncoded || 0
    const prev = lastOut
    lastOut = { at: performance.now(), bytes, frames }
    const dt = prev ? (lastOut.at - prev.at) / 1000 : 0
    return {
      fps: dt ? Math.round((lastOut.frames - prev.frames) / dt) : 0,
      kbps: dt ? Math.round((lastOut.bytes - prev.bytes) * 8 / 1000 / dt) : 0,
      w: out.frameWidth, h: out.frameHeight, limit: out.qualityLimitationReason || '', layers,
      lost: back && back.fractionLost != null ? Math.round(back.fractionLost * 1000) / 10 : null,
      budget: pair ? Math.round(pair.availableOutgoingBitrate / 1000) : null,
    }
  }

  // ---- publications to the portal's SFU ----
  const pubs = new Map()  // key → { pc, video, simulcast, audio, up }
  const LAYERS = [{ rid: 'f', scaleResolutionDownBy: 1 }, { rid: 'h', scaleResolutionDownBy: 2 }, { rid: 'q', scaleResolutionDownBy: 4 }]
  // Each layer's share of the bitrate the host set: full size gets it all, the smaller ones what their size needs.
  const SHARE = { f: 1, h: 0.3, q: 0.1 }

  // The app's sound as a track: Opus packets from PartyPortal → AudioDecoder → Web Audio → a MediaStream destination.
  // WebRTC encodes it again with its own Opus. PartyPortal's Opus is 48 kHz stereo (OpusEncoder.sampleRate).
  let sound = null, soundWhy = ''
  function soundTrack() {
    if (sound) return sound.track
    try {
      if (!('AudioDecoder' in window)) throw new Error('this WebKit has no AudioDecoder')
      const ctx = new AudioContext({ sampleRate: 48000, latencyHint: 'interactive' })
      const dest = ctx.createMediaStreamDestination()
      const s = { ctx, dest, dec: null, nextAt: 0, track: dest.stream.getAudioTracks()[0], packets: 0, played: 0 }
      s.dec = new AudioDecoder({ output: data => playSound(s, data), error: e => { soundWhy = 'decoder: ' + e; s.dec = null } })
      s.dec.configure({ codec: 'opus', sampleRate: 48000, numberOfChannels: 2 })
      ctx.resume().catch(() => {})
      sound = s
      soundWhy = ''
      return s.track
    } catch (e) { soundWhy = String(e); return null }
  }
  function soundIn(buf) {
    const s = sound
    if (!s || !s.dec || s.dec.state !== 'configured' || s.dec.decodeQueueSize > 10) return
    s.packets++
    s.dec.decode(new EncodedAudioChunk({ type: 'key', timestamp: Number(new DataView(buf).getBigInt64(2)), data: new Uint8Array(buf, 10) }))
  }
  function playSound(s, data) {
    const n = data.numberOfFrames, channels = Math.min(2, data.numberOfChannels), planes = []
    for (let c = 0; c < channels; c++) { const p = new Float32Array(n); data.copyTo(p, { planeIndex: c, format: 'f32-planar' }); planes.push(p) }
    const rate = data.sampleRate
    data.close()
    if (s.ctx.state !== 'running') { s.ctx.resume().catch(() => {}); return }
    const now = s.ctx.currentTime
    if (s.nextAt < now + 0.005) s.nextAt = now + 0.03  // ran dry: start again with a small cushion
    if (s.nextAt > now + 0.2) return                 // too much queued: skip this one to stay close to live
    const buffer = s.ctx.createBuffer(channels, n, rate)
    planes.forEach((p, c) => buffer.copyToChannel(p, c))
    const node = s.ctx.createBufferSource()
    node.buffer = buffer
    node.connect(s.dest)
    node.start(s.nextAt)
    s.nextAt += n / rate
    s.played++
  }

  // All candidates in the SDP: the SFU (and the stand-in) take one offer and one answer, no trickling.
  const gathered = (peer, ms) => new Promise(resolve => {
    if (peer.iceGatheringState === 'complete') return resolve()
    const done = () => { if (peer.iceGatheringState === 'complete') { peer.removeEventListener('icegatheringstatechange', done); resolve() } }
    peer.addEventListener('icegatheringstatechange', done)
    setTimeout(resolve, ms)
  })

  function sfuStop(key) {
    for (const [k, pub] of [...pubs]) {
      if (key !== undefined && k !== key) continue
      pubs.delete(k)
      pub.pc.onconnectionstatechange = null
      try { pub.pc.close() } catch {}
    }
  }

  async function sfuPublish(m) {
    const key = m.key || ''
    sfuStop(key)
    if (!genTrack || genTrack.readyState !== 'live') { tell({ b: 'sfu-down', key, why: 'no video track to publish: ' + (trackWhy || 'it ended') }); return }
    const peer = new RTCPeerConnection({ iceServers: m.ice || [], bundlePolicy: 'max-bundle' })
    const pub = { pc: peer, video: null, simulcast: false, audio: false, up: false, why: '' }
    pubs.set(key, pub)
    try {
      let tr = null
      if (m.simulcast) {
        try { tr = peer.addTransceiver(genTrack, { direction: 'sendonly', sendEncodings: LAYERS.map(l => ({ ...l })) }) }
        catch (e) { pub.why = String(e) }
      }
      if (!tr) tr = peer.addTransceiver(genTrack, { direction: 'sendonly' })
      pub.video = tr.sender
      const track = soundTrack()
      const atr = track ? peer.addTransceiver(track, { direction: 'sendonly' }) : null
      peer.onconnectionstatechange = () => {
        if (pubs.get(key) !== pub) return
        if (peer.connectionState === 'connected' && !pub.up) { pub.up = true; capBitrate(true); tell({ b: 'sfu-up', key }) }
        else if (['failed', 'closed'].includes(peer.connectionState)) { sfuStop(key); tell({ b: 'sfu-down', key, why: 'no path to the SFU (ICE ' + peer.iceConnectionState + ')' }) }
      }
      await peer.setLocalDescription(await peer.createOffer())
      await gathered(peer, 3000)
      if (pubs.get(key) !== pub) return
      const sdp = peer.localDescription.sdp
      pub.simulcast = /^a=simulcast:send /m.test(sdp)
      if (m.simulcast && !pub.simulcast && !pub.why) pub.why = 'WebKit left simulcast out of its offer'
      pub.audio = !!atr
      const tracks = [{ mid: tr.mid, trackName: 'video', kind: 'video' }]
      if (atr) tracks.push({ mid: atr.mid, trackName: 'audio', kind: 'audio' })
      tell({ b: 'sfu-offer', key, sdp, tracks, simulcast: pub.simulcast, audio: pub.audio, why: pub.why, soundWhy })
    } catch (e) {
      if (pubs.get(key) === pub) { sfuStop(key); tell({ b: 'sfu-down', key, why: String(e) }) }
    }
  }

  async function sfuAnswer(m) {
    const pub = pubs.get(m.key || '')
    if (!pub) return
    try { await pub.pc.setRemoteDescription({ type: 'answer', sdp: m.sdp }) }
    catch (e) { sfuStop(m.key || ''); tell({ b: 'sfu-down', key: m.key || '', why: 'answer: ' + e }) }
  }

  // Whether this WebKit puts simulcast in an offer at all, checked once with a throwaway connection.
  let simulcastProbe = null
  async function probeSimulcast() {
    if (simulcastProbe !== null || !genTrack) return
    simulcastProbe = 'checking'
    const peer = new RTCPeerConnection()
    try {
      peer.addTransceiver(genTrack, { direction: 'sendonly', sendEncodings: LAYERS.map(l => ({ ...l })) })
      const offer = await peer.createOffer()
      simulcastProbe = /^a=simulcast:send f;h;q/m.test(offer.sdp) ? 'yes' : 'no: ' + ((offer.sdp.match(/^a=simulcast:.*$/m) || ['no a=simulcast line'])[0])
    } catch (e) { simulcastProbe = 'no: ' + e }
    try { peer.close() } catch {}
  }

  function closePeer() {
    const old = pc
    pc = video = audio = ctl = sender = null
    dropping = askedKey = false
    sentKbps = 0
    lastOut = null
    if (old) { old.onconnectionstatechange = null; try { old.close() } catch {} }
  }

  function sendVideo(buf) {
    // About a quarter of a second of video waiting to leave means the link cannot keep up:
    // stop feeding it, and resume from a fresh keyframe once the queue has drained.
    const high = Math.max(120000, kbps * 1000 / 8 / 4), low = high / 4
    const isKey = (new Uint8Array(buf, 1, 1)[0] & 1) === 1
    if (dropping) {
      if (video.bufferedAmount > low) return
      if (!isKey) { if (!askedKey) { askedKey = true; tell({ b: 'kf' }) } return }
      dropping = false
    } else if (video.bufferedAmount > high) {
      dropping = true
      askedKey = false
      tell({ b: 'drop' })
      return
    }
    const bytes = new Uint8Array(buf)
    for (let off = 0; off < bytes.length; off += PIECE) {
      const part = bytes.subarray(off, off + PIECE), msg = new Uint8Array(part.length + 1)
      msg[0] = off + PIECE >= bytes.length ? 1 : 0
      msg.set(part, 1)
      video.send(msg)
    }
  }

  async function pathInfo() {
    if (!pc) return null
    const stats = await pc.getStats()
    let pair = null
    stats.forEach(s => { if (s.type === 'transport' && s.selectedCandidatePairId) pair = stats.get(s.selectedCandidatePairId) })
    if (!pair) stats.forEach(s => { if (s.type === 'candidate-pair' && s.state === 'succeeded' && (s.nominated || s.selected)) pair = pair || s })
    if (!pair) return null
    const local = stats.get(pair.localCandidateId) || {}, remote = stats.get(pair.remoteCandidateId) || {}
    return { local: local.candidateType, remote: remote.candidateType, protocol: local.protocol, rtt: pair.currentRoundTripTime }
  }

  async function onOffer(m) {
    closePeer()
    const peer = pc = new RTCPeerConnection({ iceServers: m.ice || [] })
    peer.onicecandidate = e => { if (e.candidate && pc === peer) tell({ b: 'sig', m: { type: 'rtc-cand', c: e.candidate.toJSON() } }) }
    peer.onconnectionstatechange = () => { if (pc === peer && ['failed', 'closed'].includes(peer.connectionState)) { closePeer(); tell({ b: 'closed', why: 'no path to the guest (ICE ' + peer.iceConnectionState + ')' }) } }
    let announced = false, asTrack = false
    // PartyPortal starts sending the moment we say "open", so say it only when all three channels can carry data.
    const ready = () => {
      if (pc !== peer || announced || ![ctl, video, audio].every(c => c && c.readyState === 'open')) return
      announced = true
      tell({ b: 'open', track: asTrack })
    }
    peer.ondatachannel = e => {
      if (pc !== peer) return
      const ch = e.channel
      ch.binaryType = 'arraybuffer'
      ch.onopen = ready
      if (ch.label === 'video') video = ch
      else if (ch.label === 'audio') audio = ch
      else if (ch.label === 'ctl') {
        ctl = ch
        ch.onmessage = ev => {
          if (typeof ev.data !== 'string' || ev.data.length > 4096) return
          if (ev.data.startsWith('{"t":"ping"')) { try { ch.send(JSON.stringify({ type: 'pong', n: JSON.parse(ev.data).n })) } catch {} return }
          if (ws && ws.readyState === 1) ws.send(ev.data)  // the guest's own message, for PartyPortal to judge
        }
        ch.onclose = () => { if (pc === peer) { closePeer(); tell({ b: 'closed' }) } }
      }
      ready()
    }
    try {
      // WebRTC starts a stream at about 0.3 Mbps and feels its way up for tens of seconds. Tell our encoder to
      // start near what a desktop needs; if the path cannot carry it, it backs off within a second or two.
      const start = Math.max(600, Math.min(1500, kbps))
      const sdp = m.sdp.replace(/^(a=fmtp:\d+ (?!apt=)[^\r\n]*)/gm, `$1;x-google-start-bitrate=${start};x-google-min-bitrate=300`)
      await peer.setRemoteDescription({ type: 'offer', sdp }).catch(() => peer.setRemoteDescription({ type: 'offer', sdp: m.sdp }))
      // A guest that can play a track offers to receive one; we send it when we can make one.
      const tr = peer.getTransceivers().find(t => t.receiver && t.receiver.track && t.receiver.track.kind === 'video')
      if (tr) {
        if (genTrack && genTrack.readyState === 'live') {
          tr.direction = 'sendonly'
          await tr.sender.replaceTrack(genTrack)
          sender = tr.sender
          asTrack = true
        } else tr.direction = 'inactive'
      }
      const answer = await peer.createAnswer()
      await peer.setLocalDescription(answer)
      if (pc === peer) tell({ b: 'sig', m: { type: 'rtc-answer', sdp: answer.sdp } })
      capBitrate()
    } catch (e) {
      if (pc === peer) { closePeer(); tell({ b: 'closed', why: String(e) }) }
    }
  }

  function connect() {
    ws = new WebSocket(`ws://${location.host}/bridge?k=${encodeURIComponent(key)}`)
    ws.binaryType = 'arraybuffer'
    ws.onmessage = async e => {
      if (typeof e.data !== 'string') {
        const type = new Uint8Array(e.data, 0, 1)[0]
        try {
          if (type === 2) {
            if (audio && audio.readyState === 'open' && audio.bufferedAmount < 16000) audio.send(e.data)
            if (pubs.size) soundIn(e.data)
          } else if (sender || pubs.size || (video && video.readyState === 'open')) {
            const now = performance.now()
            if (lastIn) maxInGap = Math.max(maxInGap, now - lastIn)
            lastIn = now
            if (sender || pubs.size) worker.postMessage(e.data, [e.data])
            else {
              maxBuffered = Math.max(maxBuffered, video.bufferedAmount)
              sendVideo(e.data)
            }
          }
        } catch {}
        return
      }
      const m = JSON.parse(e.data)
      if (m.type === 'video') {
        lastCfg = m
        if (worker) worker.postMessage({ cfg: m })
        try { if (!sender && video && video.readyState === 'open') video.send(e.data) } catch {}
      }
      else if (m.s === 'offer') onOffer(m)
      else if (m.s === 'cand') { try { if (pc) await pc.addIceCandidate(m.c) } catch {} }
      else if (m.s === 'reset') closePeer()
      else if (m.s === 'sfu-publish') sfuPublish(m)
      else if (m.s === 'sfu-answer') sfuAnswer(m)
      else if (m.s === 'sfu-stop') sfuStop(m.key)
      else if (m.s === 'tick') {
        kbps = m.kbps || kbps
        capBitrate()
        probeSimulcast()
        tell({ b: 'stats', inGap: Math.round(maxInGap), buffered: maxBuffered, path: await pathInfo().catch(() => null),
               canTrack: !!genTrack, trackWhy, track: await trackInfo().catch(() => null), simulcastProbe,
               sfu: [...pubs].map(([key, p]) => ({ key, state: p.pc.connectionState, simulcast: p.simulcast, audio: p.audio, why: p.why })),
               sound: sound ? { state: sound.ctx.state, packets: sound.packets, played: sound.played } : soundWhy ? { why: soundWhy } : null })
        maxInGap = maxBuffered = 0
      }
    }
    ws.onclose = () => { closePeer(); sfuStop(); setTimeout(connect, 1000) }
  }
  connect()
})()
</script>
